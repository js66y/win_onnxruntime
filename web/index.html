<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo · 离线语音助手</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌊</text></svg>">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <span class="logo-wave"></span>
          <span class="logo-wave"></span>
          <span class="logo-wave"></span>
        </div>
        <div class="brand-text">
          <h1>Echo <span class="brand-sub">回声</span></h1>
          <p id="model-name">连接中…</p>
        </div>
      </div>
      <div class="topbar-right">
        <span id="conn-dot" class="dot dot-off" title="连接状态"></span>
        <button id="btn-reset" class="btn-ghost" title="清空对话上下文">新对话</button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🌊</div>
        <h2>你好,我是回声</h2>
        <p>完全离线运行的本地 AI 助手 · 聊天内容不出这台机器</p>
        <div class="suggestions">
          <button class="chip" data-text="用一句话介绍一下你自己">介绍一下你自己</button>
          <button class="chip" data-text="给我讲一个简短的冷笑话">讲个冷笑话</button>
          <button class="chip" data-text="推荐三本值得读的科幻小说">推荐科幻小说</button>
        </div>
      </div>
    </main>

    <footer class="composer">
      <div id="voice-status" class="voice-status" data-kind=""></div>
      <div class="input-wrap">
        <button id="btn-mic" class="btn-mic hidden" title="开启/关闭语音对话">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="输入消息,Enter 发送,Shift+Enter 换行"></textarea>
        <button id="btn-send" class="btn-send" title="发送">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
        <button id="btn-stop" class="btn-stop hidden" title="停止生成">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="hint">Echo 完全在本地运行 · 点击麦克风开始语音对话</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
